<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haramaya University Smart Meal System</title>
    <meta name="description" content="Modern, secure meal service system for Haramaya University students using Code 39 barcode scanning" />
    <meta name="author" content="Haramaya University" />
    <meta property="og:title" content="Haramaya University Smart Meal System" />
    <meta property="og:description" content="Secure cafeteria meal service with barcode scanning" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="src/assets/hu-logo.png" />
  </head>
  <body>
    <noscript>
      <style>
        /* Completely hide the app root */
        #root { display: none !important; }
        
        /* Block everything */
        html, body { 
          margin: 0; 
          padding: 0; 
          overflow: hidden;
          height: 100%;
          width: 100%;
          /* Prevent text selection */
          -webkit-user-select: none;
          -moz-user-select: none;
          -ms-user-select: none;
          user-select: none;
          /* Prevent dragging */
          -webkit-user-drag: none;
          /* Prevent touch callout */
          -webkit-touch-callout: none;
        }
        
        /* Disable pointer events on everything except our message */
        body > *:not(.js-blocker) {
          pointer-events: none !important;
          visibility: hidden !important;
        }
        
        .js-blocker {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #0a0a0f;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 2147483647;
          color: #fff;
          font-family: system-ui, sans-serif;
          text-align: center;
          padding: 20px;
          box-sizing: border-box;
        }
        
        .js-blocker::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(255,0,0,0.03) 2px,
            rgba(255,0,0,0.03) 4px
          );
          pointer-events: none;
        }
        
        .js-blocker h1 { 
          color: #dc2626; 
          margin-bottom: 16px; 
          font-size: 28px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 2px;
        }
        
        .js-blocker p { 
          color: #6b7280; 
          max-width: 450px; 
          line-height: 1.7;
          font-size: 14px;
        }
        
        .js-blocker .icon { 
          font-size: 80px; 
          margin-bottom: 24px;
          filter: drop-shadow(0 0 20px rgba(220, 38, 38, 0.5));
        }
        
        .js-blocker .brand {
          margin-top: 32px; 
          color: #1e40af; 
          font-weight: 700;
          font-size: 16px;
          padding: 12px 24px;
          border: 2px solid #1e40af;
          border-radius: 8px;
        }
        
        /* Hide source view styling */
        .js-blocker * {
          -webkit-user-select: none;
          -moz-user-select: none;
          user-select: none;
        }
      </style>
      <div class="js-blocker">
        <div class="icon">⛔</div>
        <h1>Access Denied</h1>
        <p>This secure application requires JavaScript to function. Tampering with browser settings or using extensions to disable JavaScript is not permitted.</p>
        <p style="margin-top: 16px; color: #ef4444;">Please enable JavaScript and refresh the page to continue.</p>
        <div class="brand">Haramaya University Smart Meal System</div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
