<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcode Scanner Test - Haramaya University</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        color: #fff;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #10b981;
        font-size: 2rem;
      }

      .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
        font-size: 0.9rem;
      }

      .test-area {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(16, 185, 129, 0.3);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 20px;
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      button {
        background: #10b981;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s;
      }

      button:hover {
        background: #059669;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      }

      button:disabled {
        background: #64748b;
        cursor: not-allowed;
        transform: none;
      }

      .result-box {
        background: rgba(16, 185, 129, 0.1);
        border: 2px solid #10b981;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .result-box.error {
        background: rgba(239, 68, 68, 0.1);
        border-color: #ef4444;
      }

      .result-box.success {
        background: rgba(16, 185, 129, 0.2);
        border-color: #10b981;
      }

      .result-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .result-data {
        font-family: "Courier New", monospace;
        font-size: 1.5rem;
        color: #10b981;
        margin: 10px 0;
      }

      .canvas-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      canvas {
        width: 100%;
        border: 2px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        background: #000;
      }

      .canvas-label {
        text-align: center;
        margin-top: 8px;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
        text-align: center;
      }

      .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: #10b981;
      }

      .stat-label {
        font-size: 0.8rem;
        color: #94a3b8;
        margin-top: 5px;
      }

      .log {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        padding: 15px;
        max-height: 200px;
        overflow-y: auto;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        color: #94a3b8;
      }

      .log-entry {
        margin-bottom: 5px;
      }

      .log-entry.success {
        color: #10b981;
      }
      .log-entry.error {
        color: #ef4444;
      }
      .log-entry.info {
        color: #3b82f6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎯 Enhanced Barcode Scanner Test</h1>
      <p class="subtitle">
        Code 128 Student ID Scanner - Long Distance & Faded Barcode Detection
      </p>

      <div class="test-area">
        <h2 style="margin-bottom: 15px">📸 Test with Student ID Image</h2>
        <div class="controls">
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            style="display: none"
          />
          <button onclick="document.getElementById('imageInput').click()">
            Load Student ID Image
          </button>
          <button onclick="testWithPreprocessing()" id="preprocessBtn" disabled>
            Test with Preprocessing
          </button>
          <button onclick="testWithoutPreprocessing()" id="directBtn" disabled>
            Test Direct Scan
          </button>
          <button onclick="clearResults()">Clear Results</button>
        </div>

        <div class="canvas-container" id="canvasContainer"></div>

        <div id="results"></div>

        <div class="stats" id="stats" style="display: none">
          <div class="stat-card">
            <div class="stat-value" id="scanTime">--</div>
            <div class="stat-label">Scan Time (ms)</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="barcode">--</div>
            <div class="stat-label">Detected Barcode</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="format">--</div>
            <div class="stat-label">Format</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="method">--</div>
            <div class="stat-label">Method</div>
          </div>
        </div>

        <h3 style="margin-top: 30px; margin-bottom: 10px">📋 Detection Log</h3>
        <div class="log" id="log"></div>
      </div>
    </div>

    <script>
      const { BrowserMultiFormatReader, DecodeHintType, BarcodeFormat } = ZXing;

      let currentImage = null;
      let originalCanvas = null;
      let processedCanvas = null;

      function addLog(message, type = "info") {
        const log = document.getElementById("log");
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const timestamp = new Date().toLocaleTimeString();
        entry.textContent = `[${timestamp}] ${message}`;
        log.insertBefore(entry, log.firstChild);
      }

      document
        .getElementById("imageInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            addLog(`Loading image: ${file.name}`, "info");
            const reader = new FileReader();
            reader.onload = function (event) {
              const img = new Image();
              img.onload = function () {
                currentImage = img;
                displayImage(img);
                document.getElementById("preprocessBtn").disabled = false;
                document.getElementById("directBtn").disabled = false;
                addLog(`Image loaded: ${img.width}x${img.height}`, "success");
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          }
        });

      function displayImage(img) {
        const container = document.getElementById("canvasContainer");
        container.innerHTML = "";

        // Original image
        const originalDiv = document.createElement("div");
        originalCanvas = document.createElement("canvas");
        originalCanvas.width = img.width;
        originalCanvas.height = img.height;
        const ctx = originalCanvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        originalDiv.appendChild(originalCanvas);
        const label1 = document.createElement("div");
        label1.className = "canvas-label";
        label1.textContent = "Original Image";
        originalDiv.appendChild(label1);
        container.appendChild(originalDiv);

        // Processed image placeholder
        const processedDiv = document.createElement("div");
        processedCanvas = document.createElement("canvas");
        processedCanvas.width = img.width;
        processedCanvas.height = img.height;
        processedDiv.appendChild(processedCanvas);
        const label2 = document.createElement("div");
        label2.className = "canvas-label";
        label2.textContent = "Preprocessed Image (Enhanced)";
        processedDiv.appendChild(label2);
        container.appendChild(processedDiv);
      }

      function preprocessImage(canvas) {
        addLog("Applying image preprocessing...", "info");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // Contrast enhancement
        const contrast = 1.5;
        const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));

        for (let i = 0; i < data.length; i += 4) {
          const gray =
            0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          const enhanced = factor * (gray - 128) + 128;
          const value = Math.max(0, Math.min(255, enhanced));
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
        }

        // Sharpening
        const sharpened = new Uint8ClampedArray(data.length);
        const width = canvas.width;
        const height = canvas.height;
        const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];

        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            let sum = 0;
            for (let ky = -1; ky <= 1; ky++) {
              for (let kx = -1; kx <= 1; kx++) {
                const pixel = ((y + ky) * width + (x + kx)) * 4;
                const weight = kernel[(ky + 1) * 3 + (kx + 1)];
                sum += data[pixel] * weight;
              }
            }
            const idx = (y * width + x) * 4;
            const value = Math.max(0, Math.min(255, sum));
            sharpened[idx] = value;
            sharpened[idx + 1] = value;
            sharpened[idx + 2] = value;
            sharpened[idx + 3] = 255;
          }
        }

        for (let i = 0; i < data.length; i++) {
          data[i] = sharpened[i] || data[i];
        }

        ctx.putImageData(imageData, 0, 0);
        addLog("Preprocessing complete", "success");
        return canvas;
      }

      async function testWithPreprocessing() {
        addLog("Starting preprocessed scan test...", "info");
        const startTime = performance.now();

        // Copy to processed canvas
        const ctx = processedCanvas.getContext("2d");
        ctx.drawImage(currentImage, 0, 0);
        preprocessImage(processedCanvas);

        try {
          const hints = new Map();
          hints.set(DecodeHintType.POSSIBLE_FORMATS, [BarcodeFormat.CODE_128]);
          hints.set(DecodeHintType.TRY_HARDER, true);
          hints.set(DecodeHintType.PURE_BARCODE, false);
          hints.set(DecodeHintType.ALSO_INVERTED, true);

          const reader = new BrowserMultiFormatReader(hints);
          const result = await reader.decodeFromCanvas(processedCanvas);

          const endTime = performance.now();
          const scanTime = Math.round(endTime - startTime);

          displayResult(result, scanTime, "Preprocessed");
          addLog(`✓ Barcode detected: ${result.getText()}`, "success");
        } catch (error) {
          addLog(
            `✗ No barcode detected with preprocessing: ${error.message}`,
            "error"
          );
          displayError("No barcode detected with preprocessing");
        }
      }

      async function testWithoutPreprocessing() {
        addLog("Starting direct scan test...", "info");
        const startTime = performance.now();

        try {
          const hints = new Map();
          hints.set(DecodeHintType.POSSIBLE_FORMATS, [BarcodeFormat.CODE_128]);
          hints.set(DecodeHintType.TRY_HARDER, true);
          hints.set(DecodeHintType.PURE_BARCODE, false);
          hints.set(DecodeHintType.ALSO_INVERTED, true);

          const reader = new BrowserMultiFormatReader(hints);
          const result = await reader.decodeFromCanvas(originalCanvas);

          const endTime = performance.now();
          const scanTime = Math.round(endTime - startTime);

          displayResult(result, scanTime, "Direct");
          addLog(`✓ Barcode detected: ${result.getText()}`, "success");
        } catch (error) {
          addLog(`✗ No barcode detected directly: ${error.message}`, "error");
          displayError("No barcode detected with direct scan");
        }
      }

      function displayResult(result, scanTime, method) {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = `
        <div class="result-box success">
          <div class="result-title">✅ Barcode Detected Successfully!</div>
          <div class="result-data">${result.getText()}</div>
          <p style="color: #94a3b8; margin-top: 10px;">
            Format: <strong>${result.getBarcodeFormat()}</strong> | 
            Time: <strong>${scanTime}ms</strong> |
            Method: <strong>${method}</strong>
          </p>
        </div>
      `;

        document.getElementById("stats").style.display = "grid";
        document.getElementById("scanTime").textContent = scanTime;
        document.getElementById("barcode").textContent = result.getText();
        document.getElementById("format").textContent =
          result.getBarcodeFormat();
        document.getElementById("method").textContent = method;
      }

      function displayError(message) {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = `
        <div class="result-box error">
          <div class="result-title">❌ Detection Failed</div>
          <p style="color: #fca5a5; margin-top: 10px;">${message}</p>
        </div>
      `;
      }

      function clearResults() {
        document.getElementById("results").innerHTML = "";
        document.getElementById("stats").style.display = "none";
        document.getElementById("log").innerHTML = "";
        addLog("Results cleared", "info");
      }

      addLog("Scanner test utility loaded", "success");
      addLog("Load a student ID image to begin testing", "info");
    </script>
  </body>
</html>
